name: Build Android APK

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and test APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select application channel
        id: channel
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            echo "variant=StableDebug" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/stable/debug/app-stable-debug.apk" >> "$GITHUB_OUTPUT"
            echo "file=KyroAviMp4.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=KyroAviMp4-stable-apk" >> "$GITHUB_OUTPUT"
          else
            echo "variant=PreviewDebug" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/preview/debug/app-preview-debug.apk" >> "$GITHUB_OUTPUT"
            echo "file=KyroAviMp4-preview.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=KyroAviMp4-preview-apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble APK
        run: gradle ":app:assemble${{ steps.channel.outputs.variant }}" --no-daemon

      - name: Enable KVM for the Android emulator
        run: sudo chmod 666 /dev/kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-boot-timeout: 600
          script: gradle ":app:connected${{ steps.channel.outputs.variant }}AndroidTest" --no-daemon

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.channel.outputs.artifact }}-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 7

      - name: Name APK
        shell: bash
        run: cp "${{ steps.channel.outputs.apk }}" "${{ steps.channel.outputs.file }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.channel.outputs.artifact }}
          path: ${{ steps.channel.outputs.file }}
          if-no-files-found: error
          retention-days: 30
